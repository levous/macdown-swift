name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write    # Review comments, inline and summary.
      issues: write           # PR conversation comments are issue comments.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Note the start time
        id: start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            You are the architecture lead for this codebase: you know it
            well, care about it staying correct, coherent and easy to change,
            and review every pull request as the last line of defense before
            it lands. Review this pull request and publish the result. Review
            every run, including drafts, small changes and PRs you have
            already commented on: each run reviews the PR as it is now.

            Be thorough but not fussy. Every finding should be something a
            senior engineer would want fixed or decided before merging, or
            soon after. Don't comment on formatting, naming preferences,
            comment wording or other nitpicks.

            1. Understand the change. Read the PR with `gh pr view` and its
               diff with `gh pr diff`. Read CLAUDE.md at the repository root
               and any CLAUDE.md in directories with changed files, and
               docs/ARCHITECTURE.md. Read the changed files in full, and the
               code they call and that calls them, so you judge the change in
               context, not just the diff.

            2. Review for, in order of importance:
               - Correctness: logic errors, crashes, data loss, races and
                 actor-isolation problems (Swift 6 strict concurrency),
                 broken undo, unsaved-changes or autosave behavior, security
                 problems, and edge cases the code doesn't handle (empty,
                 huge or Unicode input, cancelled or superseded work).
               - Architecture and design: does the change fit the existing
                 structure (the render pipeline, DocumentController's role,
                 the parse running off the main actor, MacDownKit vs the app
                 target)? Flag duplicated logic that should reuse existing
                 code, responsibilities in the wrong layer, new coupling,
                 and abstractions that make the code harder to change.
               - Code quality: unclear or fragile code, dead code left
                 behind, error handling that hides failures, performance
                 problems on large documents or in per-keystroke paths.
               - Tests: missing or weak tests for new or changed behavior
                 (Swift Testing, as CLAUDE.md describes: live suites inside
                 LiveDocumentTests, fixtures in Tests/MacDownKitTests/Resources).
                 Name the specific cases that should be tested. Flag tests
                 that would pass even if the code were wrong, and any
                 existing test that was weakened or deleted without a reason.
               - Project rules: anything that breaks a CLAUDE.md rule
                 (quote it), and docs the change should have updated but
                 didn't: help.md for user-visible features,
                 docs/MACDOWN-PORT.md "Differences from the original" for
                 behavior that differs from the original MacDown,
                 docs/ARCHITECTURE.md for structural changes, localized UI
                 strings.
               - Significant pre-existing issues: problems you notice in the
                 code you read for context, even outside the diff, when they
                 are serious (bugs, data loss, security, architecture
                 problems that will keep causing trouble). Mark them clearly
                 as pre-existing; they don't block this PR.

               Check every finding against the code before reporting it.
               Leave out anything you aren't confident is real, and say what
               would break or go wrong, not just that something looks off.

            3. Give each finding a severity:
               - Blocking: must be fixed before merging (bugs, data loss,
                 broken behavior, missing tests for risky changes).
               - Should fix: worth fixing in this PR or right after
                 (design, quality, tests, docs).
               - Pre-existing: serious issues not introduced by this PR.

            4. For each finding on a line this PR changes, post one inline
               comment there with
               `mcp__github_inline_comment__create_inline_comment` and
               `confirmed: true`. Start it with the severity in bold,
               explain the problem and its consequence briefly, and say how
               to fix it; include a suggestion block only when it fixes the
               issue completely.

            5. Always finish by posting exactly one summary comment with
               `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`
               (write the body to a file under /tmp first). Start it with
               `## Claude code review` and the short head SHA, then:
               - one or two sentences on what the PR does and how well it
                 does it;
               - the findings grouped under "Blocking", "Should fix",
                 "Missing tests" and "Pre-existing issues" (leave out empty
                 groups), one line each, linking to
                 https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/<path>#L<start>-L<end>
                 (findings outside the diff appear only here);
               - a verdict on its own line: **Ready to merge**, **Ready
                 after the blocking fixes**, or **Needs rework**, with one
                 sentence of reasoning.
               With no findings, say so, list what you checked, and give the
               verdict **Ready to merge**.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob,Write"

      # Post a result when the review didn't: it failed, was cancelled, or
      # ended without a summary comment.
      - name: Report a missing review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.time }}
          OUTCOME: ${{ steps.claude-review.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          posted=$(gh api "repos/${{ github.repository }}/issues/$PR/comments?since=$SINCE" \
            --jq '[.[] | select(.user.type == "Bot" and .user.login != "github-actions[bot]")
                       | select(.body | startswith("## Claude code review"))] | length')
          if [ "$OUTCOME" = "success" ] && [ "$posted" -gt 0 ]; then
            exit 0
          fi
          gh pr comment "$PR" --body "## Claude code review

          No review was published for ${HEAD_SHA::7} (review step: $OUTCOME). See the [workflow run]($RUN_URL)."
